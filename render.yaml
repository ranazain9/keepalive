services:
  - type: web
    name: keepalive-voice-agent
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && cd client && npm install && npm run build && cd .."
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CAD_PROVIDER
        value: MOCK
      - key: PORT
        value: 10000
